blank_issues_enabled: false
contact_links:
  - name: Propose a change to a standard
    url: https://github.com/datumlabsio/datum-standards/blob/main/CONTRIBUTING.md
    about: Rules change by RFC, not by issue. Copy the template and open a PR — the discussion happens there.
  - name: Report a security vulnerability
    url: https://github.com/datumlabsio/.github/blob/main/SECURITY.md
    about: Never in a public issue. Use private vulnerability reporting on the affected repo.
  - name: Ask how to build something the Datum way
    url: https://github.com/datumlabsio/datum-standards
    about: Start at the README. It answers most of these in twenty minutes.
