name: Request a monorepo
description: Several components in one repository — a front end, a dbt project, a pipeline, an install's desired state.
title: "Repo request: "
labels: ["repo-request"]

body:
  - type: markdown
    attributes:
      value: |
        Fill this in and a repository will be created for you — with CI, branch
        protection, ownership and the security gates already set up, and one
        folder per component you tick.

        Someone has to approve it before it is created. You will get a comment on
        this issue either way.

        **Only one component?** Use *Request a repository* instead — go back and
        pick it from the list.

  - type: input
    id: repo_name
    attributes:
      label: Repository name
      description: Lowercase, hyphens, no spaces. This becomes the URL.
      placeholder: customer-insights
    validations:
      required: true

  - type: input
    id: repo_description
    attributes:
      label: What is it for?
      description: One line. It becomes the repository description, and it is the first thing anyone reads.
      placeholder: Ingestion and models for the Acme engagement
    validations:
      required: true

  - type: input
    id: owning_team
    attributes:
      label: Owning team
      description: >-
        The GitHub team that owns this. Lowercase with hyphens. It must already
        exist and hold write access, or CODEOWNERS will be silently ignored.
      placeholder: polaris
    validations:
      required: true

  - type: checkboxes
    id: folders
    attributes:
      label: Which parts?
      description: >-
        One folder each, with its own CI and its own owners. Pick at least one.
        Pick only one of the two web-app rows — there is a single `web-app/`
        folder and it is built one way or the other.
      options:
        - label: gitops
        - label: application
        - label: web-app (Next.js)
        - label: web-app (React + Vite)
        - label: dbt-project
        - label: dlt-pipeline

  - type: markdown
    attributes:
      value: |
        ---
        ### The rest only matters for some parts

        Leave anything below blank if it does not apply. Blank means the scaffold
        picks its own default, and the comment you get back will say what it
        picked.

  - type: dropdown
    id: warehouse
    attributes:
      label: Warehouse
      description: Only if you ticked dbt-project.
      options:
        - clickhouse
        - bigquery
        - duckdb

  - type: input
    id: source_name
    attributes:
      label: Source name
      description: >-
        Only if you ticked dlt-pipeline. Lowercase with underscores — it names
        the schema the data lands in, and downstream dbt is declared against it,
        so renaming it later is a breaking change.
      placeholder: stripe

  - type: markdown
    attributes:
      value: |
        ---
        **What happens next:** a workflow renders the repository from the
        scaffold and waits for approval. Once approved it creates the repository,
        pushes the first commit, protects `main`, and comments here with the link
        and every answer it used.
