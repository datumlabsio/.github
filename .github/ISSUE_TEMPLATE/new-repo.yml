name: Request a repository
description: One component — an application, a front end, a dbt project, a pipeline, or docs.
title: "Repo request: "
labels: ["repo-request"]

body:
  - type: markdown
    attributes:
      value: |
        Fill this in and a repository will be created for you — with CI, branch
        protection, ownership and the security gates already set up.

        Someone has to approve it before it is created. You will get a comment on
        this issue either way.

        **Several components in one repository?** Use *Request a monorepo*
        instead — go back and pick it from the list.

  - type: input
    id: repo_name
    attributes:
      label: Repository name
      description: Lowercase, hyphens, no spaces. This becomes the URL.
      placeholder: customer-insights
    validations:
      required: true

  - type: input
    id: repo_description
    attributes:
      label: What is it for?
      description: One line. It becomes the repository description, and it is the first thing anyone reads.
      placeholder: Ingestion and models for the Acme engagement
    validations:
      required: true

  - type: dropdown
    id: owning_team
    attributes:
      label: Owning team
      description: >-
        The GitHub team that owns this. **It must already have write access to
        the repository once it exists** — a CODEOWNERS entry naming a team
        without access is ignored by GitHub, with no error and no warning, and
        reviews are then required from nobody. The comment you get back says
        whether the team really has access.
      options:
        - admin-core
        - aml
        - asr
        - cffg
        - core
        - datum-core
        - devops
        - ember-capital
        - fair
        - polaris
        - ramjackwest
        - smashmath
        - students
        - vero-team
        - vision-analytics
        - workshop
        - ysl
    validations:
      required: true

  - type: dropdown
    id: archetype
    attributes:
      label: What kind of repository?
      description: >-
        If you are unsure, pick the closest single thing — it can hold more
        later. `generic` is the honest answer for anything we do not scaffold:
        it gives you the floor every repo gets and no build or test gates at
        all, rather than a hand-made repo that inherits nothing.
      options:
        - "web-app (Next.js) — a browser front end that server-renders, ships a Dockerfile and publishes an image"
        - "web-app (React + Vite) — a browser front end that builds to static files, no image"
        - "application — an installed application or platform component"
        - "gitops — one install's desired state, reconciled by Flux"
        - "dbt-project — an install's dbt project"
        - "dlt-pipeline — one ingestion pipeline"
        - "docs — standards, documentation, anything whose product is prose"
        - "generic — anything else: a scratch repo, or a stack we do not scaffold"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **That is everything we ask.** Anything else the scaffold needs — the
        warehouse for a dbt project, the source name for a pipeline — is chosen
        for you, and the comment you get back lists every value that was used and
        how to change one.

        **What happens next:** a workflow renders the repository from the
        scaffold and waits for approval. Once approved it creates the repository,
        pushes the first commit, protects `main`, and comments here with the link.
