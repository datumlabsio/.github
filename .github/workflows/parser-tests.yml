name: parser-tests

# `parse-request.py` turns a rendered issue form back into copier answers. Get
# it wrong and a repository renders with an answer nobody chose — successfully,
# and looking correct.
#
# Every case here used to need a real issue, a real approval and a real
# repository. Ten of those, each blocking on one human, and none of it re-runnable
# on a pull request. The bodies are built from the forms instead, exactly the way
# GitHub builds them.
#
# Deliberately NOT in ci.yml. That file is a thin caller — it names which shared
# stages run and pins a version, and runs nothing of its own (DES §4). This is
# repo-specific logic, so it lives in its own workflow, the way new-repo.yml
# does.
#
# Deliberately NOT path-filtered. A gate reachable only from the files it checks
# is a gate that skips: the repository-wide pre-commit hooks were reachable only
# through python-ci, and a pull request touching other folders sailed past them
# (B-66). This run takes seconds.

on:
  pull_request:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.0.0

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: The parser still reads what the forms produce
        run: python3 tests/test_parse_request.py

      # B-79. Adoption reads the archetype off the repository instead of asking,
      # because copier cannot: its Jinja context has no filesystem access,
      # _external_data dies parsing a pyproject.toml as YAML, and a Jinja
      # extension has to be pip-installed rather than shipped in the template.
      # A wrong answer here lands the wrong linter config in a pull request --
      # cheap and visible. A CONFIDENT wrong answer is the one to prevent: a
      # root-only scan called polaris "generic" because a monorepo keeps its
      # markers in subdirectories.
      - name: The archetype detector does not guess quietly
        run: python3 .github/scripts/test_detect_archetype.py

      # A pull request full of boilerplate caveats gets skimmed, and the one that
      # mattered gets skimmed with it. The case that matters most here is the
      # negative one: a clean repository must produce no output at all.
      - name: Adoption warnings fire only on real conditions
        run: python3 .github/scripts/test_adoption_warnings.py

      # copier shells out to its own git clone and the scaffold is PRIVATE.
      # actions/CLAUDE.md records this as rediscovered four times before it was
      # written down; writing it down did not stop the fifth, which failed in
      # production six steps away from the workflow that does it correctly.
      - name: Every copier step can actually reach the private scaffold
        run: python3 .github/scripts/test_copier_has_a_credential.py

      # The property gates branch protection through an organisation ruleset, so
      # a job that could clear it could unprotect a repository. These assert it
      # cannot -- and that the marker check is a query string, since `-f ref=` on
      # a GET 404s and made the first version report success having checked
      # nothing at all.
      - name: The reconciler can only ever mark a repository adopted
        run: python3 .github/scripts/test_reconcile_adoption.py
