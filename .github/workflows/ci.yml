name: ci

# A thin caller. DES §4: the caller names which stages run and pins an exact
# version; it runs nothing of its own.
#
# This repo governs the other 227 — org defaults every repo inherits, and
# default.json, the Renovate policy the whole fleet reads. Until now nothing
# checked any of it on a pull request. Every change made to default.json today
# was validated by hand, including confirming that renovate.yml existed at the
# version being pinned. That is exactly the work workflows-ci does.

# Pull requests only. A push run on main cannot work: an archetype wrapper calls
# its stages by relative reference, and a cross-repository nested call resolves on
# a pull request but dies at startup on a push — no jobs, no log. main is
# protected, so nothing reaches it except through a green pull request anyway.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # The prose half. 13 markdown files, and README plus CONTRIBUTING are what a
  # new engineer reads first.
  docs:
    uses: datumlabsio/actions/.github/workflows/docs.yml@v0.9.1
    with:
      link-check: true
      commit-lint: true

      # docs/ only, deliberately. SECURITY.md and SUPPORT.md carry known TODOs
      # that need a human decision — a security contact and the real support
      # channels — and a gate that fails on a placeholder somebody is waiting on
      # teaches people to ignore it. Widen this to the root once those are filled.
      placeholder-paths: "docs"

      # RFC-0008: vocabulary is load-bearing. Retired terms must not reappear in
      # the files a new engineer reads first.
      vocabulary-denylist: "catalog block|BlockManifest|decision product|Datum Services Standard"
      vocabulary-scan-paths: "docs README.md CONTRIBUTING.md profile"

  # The automation half. actionlint over the workflows, every datumlabsio/actions
  # pin resolves and declares what it is passed, and default.json plus
  # renovate.json actually parse as Renovate config at the major that runs.
  workflows:
    uses: datumlabsio/actions/.github/workflows/workflows-ci.yml@v0.9.1
