name: drift-watch

# B-61's other half: alert on what cannot be blocked.
#
# Some things have no gate. An organisation owner can delete a repository, flip a
# private one public, or remove a ruleset, and nothing stops them — `administration`
# has to exist and somebody has to hold it. Prevention is not available, so the
# answer is detection.
#
# THE ORIGINAL DESIGN WAS THE ORGANISATION AUDIT LOG. It is not available:
#
#   GET /orgs/datumlabsio/audit-log -> 404
#
# That API is GitHub Enterprise Cloud only, and this organisation is not on it.
# No permission fixes that. So this watches the OUTCOME instead of the event:
# it reads the current shape of each repository and compares it to what
# `watched-repos.json` says was decided.
#
# Weaker than an audit log — no actor, no timestamp, and a change reverted before
# the next run is invisible. Stronger in one way: it catches drift however it
# happened, including by an API call nobody logged as interesting.
#
# `administration: read` was granted to `datum-police` on 2026-08-31, and BOTH
# halves were watched working before this schedule went on:
#
#   checked 5 repositories
#   ::notice::All 5 repositories match what was decided.
#
# and, against a branch with seeded drift:
#
#   Sent: 2 repository setting(s) changed without a gate, across 6 watched
#     • *datumlabsio/actions* — is public, was decided private.
#     • *datumlabsio/zz-drift-proof-not-a-real-repo* — cannot be read.
#
# The second one is the point. Four scheduled jobs were found this week broken in
# the half that WRITES something, every one of them reporting success. A read
# half that works proves nothing about the half that alerts.

on:
  schedule:
    # Monday, after main-watch, conformance-audit and the stale nudge. Drift is
    # the slowest-moving of them and reads best last.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.scan.outputs.summary }}
      detail: ${{ steps.scan.outputs.detail }}
      found: ${{ steps.scan.outputs.found }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.0.0

      - name: Mint a token that can see the other repositories
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
          private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Compare each repository against what was decided
        id: scan
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          WATCHED: .github/scripts/watched-repos.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          owner = os.environ["OWNER"]
          decided = json.load(open(os.environ["WATCHED"]))
          watched = decided["repos"]
          groups = decided["runner_groups"]

          def api(path):
              """Returns (ok, parsed). ok is False for any non-zero exit."""
              p = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if p.returncode != 0:
                  return False, p.stderr.strip()
              return True, json.loads(p.stdout)

          drift, blind = [], []

          for entry in watched:
              name = entry["name"]
              full = f"{owner}/{name}"

              ok, repo = api(f"repos/{full}")
              if not ok:
                  # 404 here is the loudest thing this job can find.
                  drift.append(f"*{full}* — cannot be read. Deleted, renamed, or access lost.")
                  continue

              want = entry["visibility"]
              got = "private" if repo["private"] else "public"
              if got != want:
                  drift.append(f"*{full}* — is {got}, was decided {want}.")

              ok, rulesets = api(f"repos/{full}/rulesets")
              if not ok:
                  # NOT swallowed. "No rulesets" and "could not look" are the same
                  # output unless this is said out loud, and that confusion is
                  # exactly how a gate ends up reporting success while blind.
                  blind.append(full)
                  continue

              names = [r["name"] for r in rulesets]
              if "protect-main" not in names:
                  drift.append(f"*{full}* — `protect-main` is gone.")
                  continue

              rid = next(r["id"] for r in rulesets if r["name"] == "protect-main")
              ok, rule = api(f"repos/{full}/rulesets/{rid}")
              if not ok:
                  blind.append(full)
                  continue
              if rule.get("enforcement") != "active":
                  drift.append(f"*{full}* — `protect-main` is {rule.get('enforcement')}, not active.")
              if rule.get("bypass_actors"):
                  who = ", ".join(str(b.get("actor_id")) for b in rule["bypass_actors"])
                  drift.append(f"*{full}* — `protect-main` now has bypass actors: {who}.")

          # RUNNER GROUPS. A group is the only thing between a fork's pull
          # request on a public repository and code running on our own hardware,
          # on the office LAN. It is one toggle, in a settings page nobody
          # visits, and flipping it leaves no trace anywhere else — which is the
          # definition of what belongs in this job rather than in a gate.
          ok, live = api("orgs/" + owner + "/actions/runner-groups")
          if not ok:
              blind.append("runner groups")
              live = {"runner_groups": []}

          by_name = {g["name"]: g for g in live["runner_groups"]}
          for want in groups:
              name = want["name"]
              got = by_name.pop(name, None)
              if got is None:
                  drift.append(f"Runner group *{name}* is gone.")
                  continue
              if got["allows_public_repositories"]:
                  drift.append(f"Runner group *{name}* now allows PUBLIC "
                               f"repositories. A fork's pull request can run on "
                               f"our hardware.")
              if got["visibility"] != want["visibility"]:
                  drift.append(f"Runner group *{name}* is visible to "
                               f"{got['visibility']}, was decided "
                               f"{want['visibility']}.")
              if "repos" not in want:
                  continue
              ok, sel = api(f"orgs/{owner}/actions/runner-groups/{got['id']}/repositories")
              if not ok:
                  blind.append(f"runner group {name} repositories")
                  continue
              have = sorted(r["name"] for r in sel["repositories"])
              if have != sorted(want["repos"]):
                  drift.append(f"Runner group *{name}* grants {have}, was "
                               f"decided {sorted(want['repos'])}.")

          # A group nobody decided on is drift in its own right: it is how a
          # second, unwatched path onto the hardware appears.
          for name in by_name:
              drift.append(f"Runner group *{name}* exists and is not in "
                           f"watched-repos.json. Nobody decided it.")

          checked = len(watched)
          print(f"checked {checked} repositories and {len(groups)} runner groups")

          if blind:
              print(f"::error::Could not read rulesets for: {', '.join(blind)}. "
                    f"This needs organisation 'administration: read' on datum-police. "
                    f"Refusing to report a clean result while blind to the thing this job checks.")
              sys.exit(1)

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not drift:
              out.write("found=false\n")
              print(f"::notice::All {checked} repositories and {len(groups)} runner groups match what was decided.")
              sys.exit(0)

          out.write("found=true\n")
          out.write(f"summary={len(drift)} setting(s) changed without a gate, across {checked} repositories and {len(groups)} runner groups\n")
          out.write("detail<<DETAIL\n")
          for d in drift:
              out.write(f"• {d}\n")
          out.write("DETAIL\n")
          out.close()
          for d in drift:
              print(f"::warning::{d}")
          PY

  # Separate job so a missing webhook cannot mask the finding: `drift` has
  # already failed or warned in its own log by the time this runs.
  tell-somebody:
    needs: drift
    if: needs.drift.outputs.found == 'true'
    uses: datumlabsio/actions/.github/workflows/notify.yml@v1.5.0
    with:
      summary: ${{ needs.drift.outputs.summary }}
      detail: ${{ needs.drift.outputs.detail }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      severity: warn
    secrets:
      webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
