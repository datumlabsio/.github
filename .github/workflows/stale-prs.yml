name: stale-prs

# A correct fix sitting unmerged is indistinguishable from a fix that does not
# exist, and it gets more dangerous the longer it sits (B-61).
#
# actions#25 was opened on 24 Aug and was still open on the 27th. In that window:
# polaris#7 failed on exactly the bug it fixed, somebody landed one of its three
# changes independently because they did not know a fix was in review, and
# gitops-ci.yml moved twice underneath it — so resolving the conflict carelessly
# would have reverted shipped work.
#
# `actions` cut four releases in those three days. Review latency exceeded change
# velocity and the pull request became a hazard rather than merely late.

on:
  schedule:
    # Monday morning, before the week's work starts on top of it.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.scan.outputs.summary }}
      detail: ${{ steps.scan.outputs.detail }}
      found: ${{ steps.scan.outputs.found }}
    steps:
      # `datum-police`, not GITHUB_TOKEN. GITHUB_TOKEN is scoped to THIS
      # repository, so the first version of this job searched exactly one
      # repository of 228 and reported "Nothing went stale this week."
      #
      # A previous attempt to fix that did not land: the patch adding this step
      # was written but never saved, and the pull request said otherwise. What
      # caught it was the denominator below, on its first real run —
      # `searching 1 repositories` where 228 was meant.
      - name: Mint a token that can see other repositories
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
          private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Find pull requests that have gone stale
        id: scan
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Business days, roughly. Three working days open is late; a week is a
          # different problem.
          DAYS: "3"
          # Only alert on what crossed the line this week.
          WINDOW: "10"
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, subprocess, sys

          days, window = int(os.environ["DAYS"]), int(os.environ["WINDOW"])
          now = datetime.datetime.now(datetime.timezone.utc)
          became = now - datetime.timedelta(days=days)
          opened_after = now - datetime.timedelta(days=window)

          def api(path):
              p = subprocess.run(["gh", "api", "--paginate", path],
                                 capture_output=True, text=True)
              if p.returncode:
                  print(f"::error::{path} failed: {p.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              # --paginate concatenates JSON arrays; gh emits one array per page.
              out, dec = [], json.JSONDecoder()
              s = p.stdout.strip()
              i = 0
              while i < len(s):
                  obj, end = dec.raw_decode(s, i)
                  out.extend(obj if isinstance(obj, list) else obj.get("repositories", []))
                  i = end
                  while i < len(s) and s[i] in " \n\r\t":
                      i += 1
              return out

          # DELIBERATELY NOT `gh search`. The search API does not reliably honour
          # a GitHub App installation token for cross-repository queries, and a
          # search that quietly returns nothing is indistinguishable from a quiet
          # week. Enumerating what the token can actually see, then listing each
          # repository's pull requests, uses only endpoints an installation token
          # is documented to serve.
          repos = api("/installation/repositories")
          scanned = len(repos)
          print(f"searching {scanned} repositories", file=sys.stderr)
          if scanned == 0:
              print("::error::This token can see no repositories, so a count of "
                    "zero would mean nothing. Check the datum-police installation.",
                    file=sys.stderr)
              sys.exit(1)

          backlog, fresh = 0, []
          for r in repos:
              for pr in api(f"repos/{r['full_name']}/pulls?state=open&per_page=100"):
                  if pr.get("draft"):
                      # A draft is somebody saying it is not ready, which is the
                      # opposite of the thing being detected here.
                      continue
                  created = datetime.datetime.fromisoformat(
                      pr["created_at"].replace("Z", "+00:00"))
                  if created > became:
                      continue
                  backlog += 1
                  # The ALERT is what crossed the line THIS week. The standing
                  # backlog is a number for context — listing all of it every
                  # Monday is a channel nobody reads by the second week.
                  if created >= opened_after:
                      fresh.append(
                          f"• <{pr['html_url']}|{r['name']}#{pr['number']}> — "
                          f"{pr['title']} _({pr['user']['login']})_")

          print(f"newly stale: {len(fresh)}   standing backlog: {backlog}",
                file=sys.stderr)

          if not fresh:
              print("found=false")
              print(f"::notice::Nothing went stale this week across {scanned} "
                    f"repositories. This is the expected result.", file=sys.stderr)
              sys.exit(0)

          print("found=true")
          print(f"summary={len(fresh)} pull request(s) went stale this week "
                f"({backlog} open past {days} days across {scanned} repositories)")
          print("detail<<DETAIL")
          for line in fresh:
              print(line)
          print("DETAIL")
          PY

  tell-somebody:
    needs: find
    if: needs.find.outputs.found == 'true'
    uses: datumlabsio/actions/.github/workflows/notify.yml@v0.23.0
    with:
      summary: ${{ needs.find.outputs.summary }}
      detail: ${{ needs.find.outputs.detail }}
      severity: warn
    secrets:
      webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
