name: bot-cannot-delete

# A ONE-OFF. Delete this workflow once it has run.
#
# The whole permission design rests on one unverified claim: that
# `members_can_delete_repositories: false` gates a GitHub App and not only human
# members. GitHub's documentation for that setting talks about members and says
# nothing about Apps.
#
# It is why `datum-police` holds `administration: write` on one identity rather
# than a separate App. If the claim is wrong, a leaked key can delete every
# repository the installation reaches.
#
# So: attempt the delete, as the bot, against a throwaway repository, and require
# a refusal. Every gate in `actions` is tested this way (B-19); this control
# protects more than any of them and has never been watched refusing anything.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Throwaway repository to attempt deleting. It must be disposable."
        type: string
        required: true

permissions: {}

jobs:
  attempt:
    runs-on: ubuntu-latest
    environment: repo-creation
    steps:
      - name: Mint a bot token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
          private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: The bot must NOT be able to delete a repository
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ inputs.repository }}
        run: |
          set -uo pipefail

          # Confirm the bot can SEE it first. A 404 on delete would otherwise be
          # ambiguous — refused by policy, or simply not installed here — and
          # only the first proves anything.
          if ! gh api "repos/$OWNER/$TARGET" >/dev/null 2>&1; then
            echo "::error::The bot cannot see $OWNER/$TARGET, so a failed delete would prove nothing."
            echo "::error::Point this at a repository the installation reaches."
            exit 1
          fi
          echo "The bot can read $OWNER/$TARGET. Attempting to delete it."

          code=$(gh api -X DELETE "repos/$OWNER/$TARGET" \
                   --silent --include 2>/dev/null | head -1 | grep -oE '[0-9]{3}' || true)
          if [ -z "${code:-}" ]; then
            # gh exits non-zero and prints to stderr on refusal; capture the status.
            code=$(gh api -X DELETE "repos/$OWNER/$TARGET" 2>&1 | grep -oE 'HTTP [0-9]{3}' | grep -oE '[0-9]{3}' || echo "unknown")
          fi
          echo "DELETE returned: $code"

          if gh api "repos/$OWNER/$TARGET" >/dev/null 2>&1; then
            echo "::notice::$OWNER/$TARGET still exists. The organisation policy refused the bot."
            {
              echo "### The bot cannot delete repositories"
              echo
              echo "\`DELETE repos/$OWNER/$TARGET\` returned **$code**, and the repository still exists."
              echo
              echo "\`members_can_delete_repositories: false\` gates a GitHub App, not only human members."
              echo "That is the assumption the permission design rests on, now verified rather than believed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::$OWNER/$TARGET WAS DELETED. The organisation policy does NOT gate a GitHub App."
          echo "::error::datum-police holding administration:write means it can delete any repository it reaches."
          {
            echo "### The bot CAN delete repositories"
            echo
            echo "\`DELETE repos/$OWNER/$TARGET\` returned **$code** and the repository is gone."
            echo
            echo "The permission design assumed otherwise. \`administration: write\` needs to move to a"
            echo "separate App, or come off datum-police entirely."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
