name: new-repo

# B-59. A repository is REQUESTED, not created by hand.
#
# B-07 measured what a repository created by hand inherits in this org: secret
# scanning off, push protection off, Dependabot off, zero rulesets on `main`,
# `allowed_actions: all`. §1 claims every repository; one created today meets
# none of §3 or §4 until somebody knows to fix it, and nothing says otherwise.
#
# This makes the paved path the easy path first. Turning OFF
# `members_can_create_repositories` is a later, deliberate step — blocking
# before the alternative is proven would leave people with no way to get a
# repository at all.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  # Deliberately NOT in the repo-creation environment. This has to fire BEFORE
  # the approval, or nobody knows there is anything to approve — the request
  # would sit waiting on somebody who has not been told.
  #
  # `create` does not depend on this: a repository request must not be blocked
  # because a Slack webhook is missing.
  announce:
    if: github.event.label.name == 'repo-request'
    uses: datumlabsio/actions/.github/workflows/notify.yml@v0.23.0
    with:
      summary: "${{ github.event.issue.user.login }} requested a repository"
      detail: >-
        *${{ github.event.issue.title }}*

        Needs approval before anything is created.
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      severity: warn
    secrets:
      webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}

  create:
    # The label is applied by a person, so the trigger is already a decision.
    if: github.event.label.name == 'repo-request'
    runs-on: ubuntu-latest

    # The approval gate. The App credentials live in THIS environment, not at
    # org level, so no other workflow can reach them: an approval is the only
    # path to a token that can create a repository.
    environment: repo-creation

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Mint a token for the run
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
          private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
          # The repository does not exist yet, so the token cannot be scoped to
          # it. It is scoped to the organisation.
          owner: ${{ github.repository_owner }}

      - name: Read the request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 .github/scripts/parse-request.py

      - name: Refuse to overwrite something that already exists
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.request.outputs.repo_name }}
          ANSWERS: ${{ steps.request.outputs.answers }}
        run: |
          set -euo pipefail
          if gh api "repos/$OWNER/$NAME" >/dev/null 2>&1; then
            echo "::error::$OWNER/$NAME already exists. Nothing was created."
            exit 1
          fi
          {
            echo "### Will create \`$OWNER/$NAME\`"
            echo
            echo '```'
            echo "$ANSWERS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Render it from the scaffold
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # copier shells out to its own `git clone`, and the scaffold is
          # PRIVATE. actions/checkout's credential is local to the clone it made,
          # so without this the template clone gets nothing and git asks for a
          # username on a machine with no terminal. See actions/CLAUDE.md — this
          # is the fourth place it has been needed.
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

          tag=$(gh api "repos/$OWNER/scaffolds/releases/latest" -q .tag_name)
          echo "scaffold: $tag"

          args=()
          while IFS= read -r pair; do
            [ -n "$pair" ] && args+=(-d "$pair")
          done < "$RUNNER_TEMP/copier-args"

          uvx --from copier copier copy --trust --quiet --defaults \
            --vcs-ref "$tag" "${args[@]}" \
            "gh:$OWNER/scaffolds" "$RUNNER_TEMP/repo"

      - name: Create it, push it, protect it
        id: create
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.request.outputs.repo_name }}
          DESCRIPTION: ${{ steps.request.outputs.description }}
          ISSUE: ${{ github.event.issue.number }}
          FROM: ${{ github.repository }}
          RULESET: ${{ github.workspace }}/.github/scripts/protect-main.json
        run: |
          set -euo pipefail

          gh api -X POST "orgs/$OWNER/repos" \
            -f name="$NAME" -f description="$DESCRIPTION" -F private=true \
            -F has_issues=true -F has_wiki=false -F has_projects=false >/dev/null
          echo "created $OWNER/$NAME"

          # `delete_branch_on_merge` is accepted by the create endpoint and
          # silently ignored — the first real run produced a repository with it
          # false, having asked for true. Set it afterwards, then read it back:
          # a setting that quietly did not apply is worse than one never asked
          # for, because the repository looks configured.
          gh api -X PATCH "repos/$OWNER/$NAME" -F delete_branch_on_merge=true >/dev/null
          got=$(gh api "repos/$OWNER/$NAME" -q .delete_branch_on_merge)
          if [ "$got" != "true" ]; then
            echo "::error::delete_branch_on_merge is '$got' after being set. The repository is not configured as intended."
            exit 1
          fi

          cd "$RUNNER_TEMP/repo"
          git init -q -b main
          git config user.name "Datum Police"
          git config user.email "datum-police[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: scaffold $NAME" -m "Requested in $FROM#$ISSUE."
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$NAME.git"
          git push -q origin main

          # The same protect-main ruleset the conformant repositories carry, so a
          # repository is protected from its first commit rather than from
          # whenever somebody remembers.
          gh api -X POST "repos/$OWNER/$NAME/rulesets" --input "$RULESET" >/dev/null
          echo "protect-main applied"
          echo "url=https://github.com/$OWNER/$NAME" >> "$GITHUB_OUTPUT"

      - name: Tell the requester
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          URL: ${{ steps.create.outputs.url }}
          NAME: ${{ steps.request.outputs.repo_name }}
          ISSUE: ${{ github.event.issue.number }}
          FROM: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${URL:-}" ]; then
            printf '%s\n\n%s\n\n%s\n' \
              "**$NAME is ready:** $URL" \
              "It already has CI, \`protect-main\`, an owning team in \`CODEOWNERS\` and the security gates. Clone it and start." \
              "\`scaffold-update\` and \`main-watch\` already reach it: GitHub grants an App access to any repository that App creates, even when it is installed on selected repositories only. Nothing to add by hand." \
              > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --repo "$FROM" --body-file "$RUNNER_TEMP/comment.md"
            gh issue close "$ISSUE" --repo "$FROM" --reason completed
          else
            printf '%s\n' \
              "Could not create the repository — see the [run log]($RUN). This issue is left open deliberately: fix the request and re-apply the \`repo-request\` label." \
              > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --repo "$FROM" --body-file "$RUNNER_TEMP/comment.md"
          fi
