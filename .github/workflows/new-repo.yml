name: new-repo

# B-59. A repository is REQUESTED, not created by hand.
#
# B-07 measured what a repository created by hand inherits in this org: secret
# scanning off, push protection off, Dependabot off, zero rulesets on `main`,
# `allowed_actions: all`. §1 claims every repository; one created today meets
# none of §3 or §4 until somebody knows to fix it, and nothing says otherwise.
#
# This makes the paved path the easy path first. Turning OFF
# `members_can_create_repositories` is a later, deliberate step — blocking
# before the alternative is proven would leave people with no way to get a
# repository at all.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  # Deliberately NOT in the repo-creation environment, so it cannot be delayed
  # or blocked by anything guarding that environment.
  #
  # `create` does not depend on this: a repository request must not be blocked
  # because a Slack webhook is missing.
  announce:
    if: github.event.label.name == 'repo-request'
    uses: datumlabsio/actions/.github/workflows/notify.yml@v0.23.0
    with:
      summary: "${{ github.event.issue.user.login }} requested a repository"
      detail: >-
        *${{ github.event.issue.title }}*

        Being created now.
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      severity: warn
    secrets:
      webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK }}

  create:
    # The label is applied by a person, so the trigger is already a decision.
    if: github.event.label.name == 'repo-request'
    runs-on: ubuntu-latest

    # There is NO approval step, and that is deliberate. Any member can already
    # create a repository by hand — `members_can_create_repositories` is true on
    # purpose — so requiring a human to approve this path made the paved road
    # harder to walk than the unpaved one, which is backwards. This is offered as
    # an ALTERNATIVE to running copier yourself, not as a checkpoint.
    #
    # The environment stays, because the environment was never really the
    # approval. The factory App's credentials live in it rather than at
    # organisation level, so no other workflow in this repository can reach a
    # token that holds `administration: write`. That isolation is the control and
    # it is unchanged.
    environment: repo-creation

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # datum-repo-factory, NOT datum-police.
      #
      # `datum-police` held `administration: write` until a test proved what the
      # documentation does not say: `members_can_delete_repositories: false`
      # gates human members only. A bot with that permission deleted a repository
      # outright — `DELETE` returned 204.
      #
      # So repository creation runs as an App that holds `administration` and
      # `contents` and NOTHING else, and whose key exists only as a secret on
      # this environment. `datum-police` keeps `contents`, `workflows`, `issues`
      # and `pull_requests` at organisation level and can no longer delete
      # anything.
      #
      # The separation is the point: a credential reachable from every workflow
      # must not be able to destroy a repository, and one that can create
      # repositories must be reachable from exactly one job.
      - name: Mint a token for the run
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_FACTORY_APP_ID }}
          private-key: ${{ secrets.DATUM_FACTORY_PRIVATE_KEY }}
          # The repository does not exist yet, so the token cannot be scoped to
          # it. It is scoped to the organisation.
          owner: ${{ github.repository_owner }}

      # The factory token can create repositories and NOTHING else it does not
      # need — it holds no `issues` permission and is installed on selected
      # repositories, so it cannot read `scaffolds` either.
      #
      # Those two jobs belong to `datum-police`, which already has them. Using
      # one token for everything would mean widening the factory until it is
      # just `datum-police` with `administration` back on, which is the thing
      # this split exists to prevent.
      - name: Mint the reader/commenter token
        id: scribe
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
          private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Read the request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 .github/scripts/parse-request.py

      # ADVISORY, not the guard. Both Apps are installed on selected
      # repositories, so a 404 here means "this token cannot see it", which is
      # not the same as "it does not exist". The real refusal is
      # `POST /orgs/{org}/repos`, which returns 422 on a duplicate name and
      # fails the step below.
      # A dropdown of real teams was tried and reverted: it is regenerated on a
      # schedule, so a team created on Tuesday was not selectable until the
      # following Monday, and the requester's only options were to wait or to
      # name somebody else's team. A control with a week of lag is not a control.
      #
      # Checking the name instead has neither problem — no lag, and a typo is
      # refused with the real list rather than rendering a CODEOWNERS entry that
      # GitHub silently ignores.
      #
      # Possible at all only because `datum-police` was granted organisation
      # `Members: read`. Before that this could not be asked.
      - name: The owning team is a real team
        env:
          GH_TOKEN: ${{ steps.scribe.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          ANSWERS: ${{ steps.request.outputs.answers }}
        run: |
          set -euo pipefail
          team=$(printf '%s' "$ANSWERS" | jq -r '.owning_team // empty')
          if [ -z "$team" ]; then
            echo "::error::No owning team was given."
            exit 1
          fi
          if gh api "orgs/$OWNER/teams/$team" >/dev/null 2>&1; then
            echo "$team exists"
            exit 0
          fi
          # Naming the real teams matters more than saying no. A requester who
          # guessed "data" instead of "datum-core" cannot fix it from "invalid".
          echo "::error::'$team' is not a team in $OWNER. Valid teams: $(gh api --paginate "orgs/$OWNER/teams" -q '.[].slug' | sort | paste -sd, - | sed 's/,/, /g')"
          exit 1

      - name: Refuse to overwrite something that already exists
        env:
          GH_TOKEN: ${{ steps.scribe.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.request.outputs.repo_name }}
          ANSWERS: ${{ steps.request.outputs.answers }}
        run: |
          set -euo pipefail
          if gh api "repos/$OWNER/$NAME" >/dev/null 2>&1; then
            echo "::error::$OWNER/$NAME already exists. Nothing was created."
            exit 1
          fi
          {
            echo "### Will create \`$OWNER/$NAME\`"
            echo
            echo '```'
            echo "$ANSWERS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Render it from the scaffold
        env:
          # scribe, not factory: `scaffolds` is private and the factory App is
          # not installed on it. With the factory token the release lookup
          # returns a bare `gh: Not Found (HTTP 404)`.
          GH_TOKEN: ${{ steps.scribe.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # copier shells out to its own `git clone`, and the scaffold is
          # PRIVATE. actions/checkout's credential is local to the clone it made,
          # so without this the template clone gets nothing and git asks for a
          # username on a machine with no terminal. See actions/CLAUDE.md — this
          # is the fourth place it has been needed.
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

          tag=$(gh api "repos/$OWNER/scaffolds/releases/latest" -q .tag_name)
          echo "scaffold: $tag"

          args=()
          while IFS= read -r pair; do
            [ -n "$pair" ] && args+=(-d "$pair")
          done < "$RUNNER_TEMP/copier-args"

          # stderr to a FILE, not through a process substitution. `2> >(tee ...)`
          # is not synchronised with the shell that spawned it, so under `bash -e`
          # the step can exit before tee flushes — leaving the failure report
          # empty, in the one piece of code whose whole job is reporting failures.
          if ! uvx --from copier copier copy --trust --quiet --defaults \
                 --vcs-ref "$tag" "${args[@]}" \
                 "gh:$OWNER/scaffolds" "$RUNNER_TEMP/repo" \
                 2> "$RUNNER_TEMP/copier.err"; then
            cat "$RUNNER_TEMP/copier.err" >&2
            exit 1
          fi

      - name: Create it, push it, protect it
        id: create
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.request.outputs.repo_name }}
          DESCRIPTION: ${{ steps.request.outputs.description }}
          ANSWERS: ${{ steps.request.outputs.answers }}
          ISSUE: ${{ github.event.issue.number }}
          FROM: ${{ github.repository }}
          RULESET: ${{ github.workspace }}/.github/scripts/protect-main.json
        run: |
          set -euo pipefail

          gh api -X POST "orgs/$OWNER/repos" \
            -f name="$NAME" -f description="$DESCRIPTION" -F private=true \
            -F has_issues=true -F has_wiki=false -F has_projects=false >/dev/null
          echo "created $OWNER/$NAME"
          # Recorded IMMEDIATELY, before anything that can still fail. The
          # ordering here is forced: `protect-main` blocks direct pushes, so the
          # first push must land BEFORE the ruleset. That means every failure
          # between here and the end of this step leaves a real repository
          # behind, and the request has to say so rather than claim nothing
          # happened.
          echo "created=true" >> "$GITHUB_OUTPUT"

          # `delete_branch_on_merge` is accepted by the create endpoint and
          # silently ignored — the first real run produced a repository with it
          # false, having asked for true. Set it afterwards, then read it back:
          # a setting that quietly did not apply is worse than one never asked
          # for, because the repository looks configured.
          gh api -X PATCH "repos/$OWNER/$NAME" -F delete_branch_on_merge=true >/dev/null
          got=$(gh api "repos/$OWNER/$NAME" -q .delete_branch_on_merge)
          if [ "$got" != "true" ]; then
            echo "::error::delete_branch_on_merge is '$got' after being set. The repository is not configured as intended."
            exit 1
          fi

          cd "$RUNNER_TEMP/repo"
          git init -q -b main
          git config user.name "Datum Repo Factory"
          git config user.email "datum-repo-factory[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: scaffold $NAME" -m "Requested in $FROM#$ISSUE."
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$NAME.git"
          git push -q origin main

          # The same protect-main ruleset the conformant repositories carry, so a
          # repository is protected from its first commit rather than from
          # whenever somebody remembers.
          gh api -X POST "repos/$OWNER/$NAME/rulesets" --input "$RULESET" >/dev/null
          echo "protect-main applied"

          # CODEOWNERS names the owning team. GitHub ignores a CODEOWNERS entry
          # for a team with no access to the repository — no error, no warning,
          # and reviews are then required from nobody. The file looks right and
          # enforces nothing.
          #
          # Granting the access from here would need organisation `Members:
          # write` on an App that already holds `administration`. That is a
          # decision, not a line of YAML. Until it is taken, this reads back what
          # access actually exists and says so, rather than leaving a repository
          # that looks owned and is not.
          team=$(printf '%s' "$ANSWERS" | jq -r '.owning_team // empty')
          if [ -n "$team" ] && gh api "repos/$OWNER/$NAME/teams" -q '.[].slug' | grep -qxF "$team"; then
            echo "team_access=true" >> "$GITHUB_OUTPUT"
            echo "$team has access"
          else
            echo "team_access=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$team has no access to $OWNER/$NAME, so its CODEOWNERS entry is inert until somebody grants it."
          fi

          echo "url=https://github.com/$OWNER/$NAME" >> "$GITHUB_OUTPUT"

      - name: Tell the requester
        if: always()
        env:
          # scribe, not factory: the factory App holds no `issues` permission,
          # and `gh issue comment` fails with
          # `Resource not accessible by integration (addComment)`.
          GH_TOKEN: ${{ steps.scribe.outputs.token }}
          URL: ${{ steps.create.outputs.url }}
          CREATED: ${{ steps.create.outputs.created }}
          TEAM_ACCESS: ${{ steps.create.outputs.team_access }}
          ANSWERS: ${{ steps.request.outputs.answers }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.request.outputs.repo_name }}
          ISSUE: ${{ github.event.issue.number }}
          FROM: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # What the scaffold was actually given. A mis-mapped answer renders a
          # repository that looks perfectly fine — wrong warehouse, wrong
          # framework, no `rfcs/` folder — and nothing fails. The requester is
          # the only person who knows what they asked for, so show them.
          # The RENDERED answers file, not what the form collected. The form
          # deliberately asks four questions; everything else the scaffold needs
          # is defaulted. Echoing only what was typed would hide exactly the
          # values nobody chose — the warehouse, the source name — which are the
          # ones worth checking.
          #
          # `.copier-answers.yml` is written by copier itself and is the whole
          # truth, defaults included. It exists even when the run failed after
          # rendering.
          answers_block() {
            af="$RUNNER_TEMP/repo/.copier-answers.yml"
            if [ -f "$af" ]; then
              printf '%s\n\n~~~yaml\n%s\n~~~\n\n%s\n\n' \
                "**Built from these answers.** Anything you were not asked took the scaffold's default:" \
                "$(grep -v '^_src_path' "$af")" \
                "To change one later, in the new repository: \`copier update -d <key>=<value>\`" 
            elif [ -n "${ANSWERS:-}" ]; then
              printf '%s\n\n' "**Built from these answers:**"
              printf '%s' "$ANSWERS" | jq -r 'to_entries[] | "- " + .key + ": " + (.value|tostring)'
              printf '\n'
            fi
          }

          if [ -n "${URL:-}" ]; then
            {
              printf '%s\n\n' "**$NAME is ready:** $URL"
              answers_block
              if [ "${TEAM_ACCESS:-}" != "true" ]; then
                team=$(printf '%s' "${ANSWERS:-}" | jq -r '.owning_team // "the owning team"')
                printf '%s\n\n' "**Action needed: $team does not have access to this repository yet.** Its CODEOWNERS entry is ignored by GitHub until an owner grants the team write access, which means reviews are currently required from nobody. Ask an organisation owner to add it under *Settings to Collaborators and teams*."
              fi
            } > "$RUNNER_TEMP/head.md"
            printf '%s\n\n%s\n\n%s\n\n%s\n' \
              "$(cat "$RUNNER_TEMP/head.md")" \
              "It already has CI, \`protect-main\`, an owning team in \`CODEOWNERS\` and the security gates. Clone it and start." \
              "\`main-watch\` works from this first commit — it uses the built-in \`GITHUB_TOKEN\` and needs nothing granted." \
              "**\`scaffold-update\` does not run here yet.** It pushes to \`.github/workflows/\`, which \`GITHUB_TOKEN\` is forbidden to do, so it needs the \`DATUM_POLICE_APP_ID\` and \`DATUM_POLICE_PRIVATE_KEY\` organisation secrets granted to this repository by an owner. Until then this repository will not receive new scaffold releases, and its weekly run will say so rather than fail." \
              > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --repo "$FROM" --body-file "$RUNNER_TEMP/comment.md"
            gh issue close "$ISSUE" --repo "$FROM" --reason completed
          elif [ "${CREATED:-}" = "true" ]; then
            # The dangerous case, and the one that used to be reported as
            # "could not create the repository". It DID create it. An empty,
            # UNPROTECTED repository is sitting there, and saying otherwise
            # sends somebody looking for a problem that is not the problem.
            printf '%s\n\n%s\n\n%s\n' \
              "**\`$OWNER/$NAME\` was created and then left incomplete** — see the [run log]($RUN)." \
              "It has no commits and **no \`protect-main\` ruleset**. It is not safe to start work in." \
              "Delete it, fix the cause, then re-apply the \`repo-request\` label. This issue is left open deliberately." \
              > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --repo "$FROM" --body-file "$RUNNER_TEMP/comment.md"
            echo "::error::$OWNER/$NAME exists but is empty and unprotected. Delete it before retrying."
          else
            {
              printf '%s\n' "Nothing was created — see the [run log]($RUN). This issue is left open deliberately: fix the request and re-apply the \`repo-request\` label."
              # copier's own words. It already validates `source_name`,
              # `owning_team` and `folders`, and its messages are plain English.
              # Re-stating those rules here would be a second copy that drifts.
              if [ -s "$RUNNER_TEMP/copier.err" ]; then
                # copier raises through plumbum, so its stderr is a Python
                # traceback with the ONE useful line at the bottom. `tail -40`
                # put forty lines of stack into the comment and buried it — a
                # real requester got a wall of `site-packages` paths and had to
                # read to the end to find "Invalid choice for 'warehouse'".
                #
                # Last non-empty line first, stack behind a fold.
                #
                # `~~~` rather than backticks: markdown accepts either, and a
                # backtick inside single quotes reads to shellcheck as an
                # attempted command substitution (SC2016).
                why=$(awk 'NF { last = $0 } END { print last }' "$RUNNER_TEMP/copier.err" \
                      | sed -E 's/^[A-Za-z_]*(Error|Exception): //')
                printf '\n%s\n\n~~~\n%s\n~~~\n' "The scaffold refused it:" "${why:-see the run log}"
                printf '\n<details><summary>Full output</summary>\n\n~~~\n%s\n~~~\n\n</details>\n' \
                  "$(tail -n 40 "$RUNNER_TEMP/copier.err")"
              fi
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --repo "$FROM" --body-file "$RUNNER_TEMP/comment.md"
          fi
