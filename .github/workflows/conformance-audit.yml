name: conformance-audit

# DES §12: a scheduled audit of every repo the standard binds, with drift opening
# an issue against the owning crew.
#
# ONE REPO, ON PURPOSE. The standard is being proved on `polaris` first: make it
# the repo you can show another team and say "this is how it works". Other repos
# adopt afterwards, one at a time, and each joins this list as it does.
#
# The machinery repos — actions, scaffolds, .github — are deliberately NOT here.
# They build the standard rather than being examples of it, and `actions` cannot
# ever satisfy "born from a scaffold" because it is the thing scaffolds call. A
# finding nobody can act on is a finding everybody learns to scroll past, and it
# takes the real ones with it.
#
# STILL REPORT-ONLY. `dry-run: true` prints findings and files nothing, until a
# human has read a full run and agreed the findings are real.
#
# Flipping it is a one-line change to `dry-run`, deliberately.

on:
  schedule:
    # Monday, after Renovate. A conformance report that lands with the week's
    # dependency PRs is read at the same time as them.
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      repos:
        description: "Override the audited list, space-separated owner/repo."
        type: string
        default: ""
      dry-run:
        description: "Leave true to report without filing."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: conformance-audit
  cancel-in-progress: false

jobs:
  audit:
    uses: datumlabsio/actions/.github/workflows/conformance-audit.yml@v0.14.0
    permissions:
      contents: read
      issues: write
    with:
      # Explicit rather than autodiscovered. A repo joins this list when it
      # adopts the standard, which is a decision somebody makes rather than
      # something a workflow infers.
      repos: ${{ inputs.repos || 'datumlabsio/polaris' }}
      dry-run: ${{ inputs.dry-run == null && true || inputs.dry-run }}
    secrets:
      app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
      private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}

  # B-79. `datum-standard: adopted` means the standard is ON the default branch,
  # not that somebody asked for it -- adopt-repo.yml used to set it when it
  # OPENED the pull request, which marked a repository adopted, and
  # branch-protected under the organisation ruleset keyed on it, while the pull
  # request sat unreviewed.
  #
  # HERE rather than in a workflow of its own. This one already runs on this
  # cadence, already holds the token, and already reads `.copier-answers.yml` --
  # a second schedule to notice the same file would be a second thing to forget
  # about. `workflow_dispatch` covers the case where somebody wants it now.
  #
  # It can only ever SET `adopted`, and only where the marker is on the default
  # branch. It never clears a value and never writes `exempt`: the property gates
  # branch protection, so a job that could clear it could unprotect a repository.
  adoption:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
          private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Follows the audit's own dry-run input, so one switch governs both:
      # a manual run reports, the scheduled run acts.
      - name: Mark what is actually adopted
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry-run }}" = "false" ]; then
            python3 .github/scripts/reconcile_adoption.py --apply
          else
            python3 .github/scripts/reconcile_adoption.py
          fi
