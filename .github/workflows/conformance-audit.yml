name: conformance-audit

# DES §12: a scheduled audit of every repo the standard binds, with drift opening
# an issue against the owning crew.
#
# ONE REPO, ON PURPOSE. The standard is being proved on `polaris` first: make it
# the repo you can show another team and say "this is how it works". Other repos
# adopt afterwards, one at a time, and each joins this list as it does.
#
# The machinery repos — actions, scaffolds, .github — are deliberately NOT here.
# They build the standard rather than being examples of it, and `actions` cannot
# ever satisfy "born from a scaffold" because it is the thing scaffolds call. A
# finding nobody can act on is a finding everybody learns to scroll past, and it
# takes the real ones with it.
#
# STILL REPORT-ONLY. `dry-run: true` prints findings and files nothing, until a
# human has read a full run and agreed the findings are real.
#
# Flipping it is a one-line change to `dry-run`, deliberately.

on:
  schedule:
    # Monday, after Renovate. A conformance report that lands with the week's
    # dependency PRs is read at the same time as them.
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      repos:
        description: "Override the audited list, space-separated owner/repo."
        type: string
        default: ""
      dry-run:
        description: "Leave true to report without filing."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: conformance-audit
  cancel-in-progress: false

jobs:
  audit:
    uses: datumlabsio/actions/.github/workflows/conformance-audit.yml@v0.14.0
    permissions:
      contents: read
      issues: write
    with:
      # Explicit rather than autodiscovered. A repo joins this list when it
      # adopts the standard, which is a decision somebody makes rather than
      # something a workflow infers.
      repos: ${{ inputs.repos || 'datumlabsio/polaris' }}
      dry-run: ${{ inputs.dry-run == null && true || inputs.dry-run }}
    secrets:
      app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
      private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
