name: renovate

# The org's dependency updates. One scheduled caller for the whole fleet, rather
# than a workflow in every repo — a repo opts in by carrying renovate.json, which
# its scaffold writes at birth.
#
# The policy is in default.json alongside this file. This only decides WHEN.
#
# Monday morning rather than continuously: a bump that arrives on a Monday gets
# read, and one that arrives all week gets muted. A muted queue is the same as no
# Renovate at all.
#
# datumlabsio/actions bumps ignore this schedule by design — default.json gives
# them `schedule: at any time`, because that pull request is the path a CI gate
# fix travels to every repo.

on:
  schedule:
    - cron: "0 4 * * 1"

  # For "I do not want to wait until Monday", and for the first run after the
  # token lands.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve and log everything, open nothing."
        type: boolean
        default: false
      log-level:
        description: "debug when working out why a repo was skipped."
        type: string
        default: "info"

permissions:
  contents: read

concurrency:
  # Two Renovates writing to the same repos race and open duplicate branches. A
  # long weekly run overlapping a manual one is exactly how that happens.
  group: renovate-org
  cancel-in-progress: false

jobs:
  renovate:
    uses: datumlabsio/actions/.github/workflows/renovate.yml@v1.5.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
      log-level: ${{ inputs.log-level || 'info' }}

      # Named, not `datumlabsio/*`.
      #
      # Renovate autodiscovers every repository the App is installed on, and
      # only acts on the ones that already carry a config -- which was a good
      # enough guard while the App was installed on a handful. It stops being
      # one the moment the installation covers the whole organisation.
      #
      # `datum-platform` is the case that made this concrete: it carries a
      # renovate.json, has never received a bot pull request, and runs macOS
      # jobs at roughly ten times the Linux rate. Widening the installation
      # would have opened a first-run burst there and put it on the bill,
      # arriving as a surprise rather than a decision.
      #
      # THE COST OF THIS LIST: a repository that adopts and is not added here
      # silently stops receiving dependency bumps. Add it in the same pull
      # request that adopts it.
      #
      # One line, no spaces after the commas: Renovate splits this on `,` and
      # does not trim, so a folded block scalar would hand it ` datumlabsio/x`
      # and match nothing -- silently, because a filter that matches nothing
      # looks exactly like a week with no updates due.
      autodiscover-filter: "datumlabsio/actions,datumlabsio/scaffolds,datumlabsio/.github,datumlabsio/polaris,datumlabsio/dl-assessment-platform,datumlabsio/ember"
    secrets:
      # datum-police, a GitHub App — DES §7 and docs/bot-identities.md: an
      # automation gets its own app, not a person's token. The workflow mints a
      # short-lived token from these and revokes it when the job ends, so nothing
      # long-lived is stored anywhere.
      app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
      private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
