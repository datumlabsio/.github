name: refresh-teams

# The owning-team dropdown is a list of real teams, and Issue Forms are static —
# options cannot be fetched when the form is rendered. So the file is regenerated
# instead, and a pull request is opened when the org's teams have changed.
#
# `Members: read` was granted to `datum-police` on 2026-08-28, so this can now
# list the organisation's teams and the weekly schedule is on.
#
# Both halves were watched working before the cron was turned on — the no-op path
# ("the dropdown already matches") and the path that actually opens a pull
# request. The second one was broken, and only a real run found it. See the
# checkout below.
#
# The dropdown is a convenience, never the gate. `new-repo` reads back whether
# the owning team actually has access to the repository it just made, and says so
# in the comment. Keep both.

on:
  schedule:
    # Monday morning, before anybody requests a repository for the week.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # BEFORE the checkout, and handed to it. `actions/checkout` stores whatever
      # token it is given as git's credential for this repository, and `git push`
      # uses THAT — not the `GH_TOKEN` environment variable a later step sets.
      # Minting afterwards left the read-only GITHUB_TOKEN in git's config and
      # the push died on `403`, in a step nothing had ever run.
      #
      # Same shape as the copier credential problem in `scaffold-update`: `gh`
      # reads an environment variable, `git` does not.
      - name: Mint a token that can see the organisation
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DATUM_POLICE_APP_ID }}
          private-key: ${{ secrets.DATUM_POLICE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Rewrite the dropdown from the real teams
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Deliberately NOT guarded into a notice. If this cannot list teams it
          # has done nothing, and a green run that did nothing is worse than a
          # red one — that is the lesson from a scheduled watch that reported
          # success in every repository it could not authenticate to.
          if ! gh api --paginate "orgs/$OWNER/teams" -q '.[].slug' | sort > teams.txt; then
            echo "::error::Could not list the teams in $OWNER. This needs organisation 'Members: read' on datum-police."
            exit 1
          fi
          echo "teams: $(wc -l < teams.txt)"

          python3 - <<'PY'
          import pathlib, re, sys

          teams = [t.strip() for t in open("teams.txt") if t.strip()]
          if not teams:
              print("::error::The organisation reported zero teams. Refusing to empty the dropdown.")
              sys.exit(1)

          # copier validates owning_team against this. A team that fails it
          # cannot be used, and putting it in a dropdown promises otherwise.
          VALID = re.compile(r"[a-z0-9][a-z0-9-]{1,38}")
          for t in teams:
              if not VALID.fullmatch(t):
                  print(f"::warning::'{t}' cannot be used as an owning team — copier requires "
                        f"lowercase letters, digits and hyphens. Rename the team, or it will "
                        f"fail at render time for whoever picks it.")

          options = "\n".join(f"        - {t}" for t in teams)
          changed = []
          for path in sorted(pathlib.Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              # Replace only the options block that belongs to owning_team.
              pattern = re.compile(
                  r"(?P<head>  - type: dropdown\n    id: owning_team\n(?:.*?\n)*?      options:\n)"
                  r"(?P<opts>(?:        - .*\n)+)"
              )
              new, n = pattern.subn(lambda m: m.group("head") + options + "\n", text)
              if n and new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(path.name)
              elif n == 0 and "id: owning_team" in text:
                  print(f"::error::{path.name} has an owning_team field this could not rewrite. "
                        f"The dropdown would silently stop tracking the real teams.")
                  sys.exit(1)

          # The rewrite above is a regular expression over YAML, which this
          # track has got wrong four times. So it is verified by PARSING the
          # result: if the edit put the options anywhere but owning_team, or
          # mangled the file, this fails here rather than shipping a dropdown
          # that silently stopped tracking the real teams.
          import yaml
          for path in sorted(pathlib.Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              doc = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              for block in doc.get("body", []):
                  if block.get("id") != "owning_team":
                      continue
                  got = block.get("attributes", {}).get("options")
                  if got != teams:
                      print(f"::error::{path.name} did not come out right after the rewrite. "
                            f"Expected {len(teams)} teams, found {got!r}.")
                      sys.exit(1)

          print("changed: " + (", ".join(changed) if changed else "nothing"))
          PY

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          rm -f teams.txt
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::The dropdown already matches the organisation's teams."
            exit 0
          fi
          branch="chore/refresh-the-owning-team-dropdown"
          git config user.name "Datum Police"
          git config user.email "datum-police[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -aqm "chore: refresh the owning-team dropdown"
          git push -qf origin "$branch"
          gh pr create --fill --head "$branch" --base "${{ github.ref_name }}" 2>/dev/null \
            || echo "::notice::A pull request for this branch is already open; it has been updated."
